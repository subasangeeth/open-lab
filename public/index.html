<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloud Native ALB Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
    font-family: Arial;
    text-align: center;
    margin-top: 60px;
}
.container {
    width: 420px;
    margin: auto;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="container">
<h2>☁️ ALB Dashboard</h2>

<p id="status">Loading...</p>

<p>IP: <span id="ip">--</span></p>
<p>Host: <span id="host">--</span></p>
<p>Instance: <span id="iid">--</span></p>
<p>AZ: <span id="az">--</span></p>

</div>

<script>
async function load() {
    try {
        const res = await fetch('/ip');
        const d = await res.json();

        document.getElementById("status").innerText = "Connected";
        document.getElementById("ip").innerText = d.ip;
        document.getElementById("host").innerText = d.hostname;
        document.getElementById("iid").innerText = d.instanceId;
        document.getElementById("az").innerText = d.availabilityZone;
    } catch {
        document.getElementById("status").innerText = "Error";
    }
}
setInterval(load, 3000);
load();
</script>

</body>
</html>
